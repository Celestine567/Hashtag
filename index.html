<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage </title>
<link href="css.css" rel="stylesheet" type="text/css" media="all"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Blinker:wght@100;200;300;400;600;700;800;900amp;display=swap" rel="stylesheet">
</head>

<body>
<!-- ===== Heading ===== -->
<header class="site-header">
  <a class="brand" href="index.html" aria-label="Home">
    <img class="brand-logo" src="logo.svg" alt="logo-image">
    <div>
      <p class="wordmark">Ziyi Liu</p>
      <p class="role" data-i18n="role">UI/UX Designer</p>
    </div>
  </a>
  <div class="lang-switch" id="langSwitch" role="group" aria-label="Language" data-lang="en">
    <span class="lang-thumb" aria-hidden="true"></span>
    <button class="lang-btn" type="button" data-set-lang="en" aria-pressed="true">EN</button>
    <button class="lang-btn" type="button" data-set-lang="zh" aria-pressed="false">CN</button>
  </div>
  <nav class="site-nav" aria-label="Main">
    <a href="allProject.html" data-i18n="nav.projects">All Projects</a>
    <a href="about.html" data-i18n="nav.about">About</a>
  </nav>
</header>

<main class="stage" id="stage">
  <!-- bottom decorartion (JS) -->
  <div class="layer layer-bg" id="layerBg" aria-hidden="true"></div>

  <!-- middle layer - 4 project' bubbles -->
  <div class="layer layer-main">

    <div class="slot" data-side="right"
         style="--x:31%;--y:34%;--size:min(34vw,310px);--tint:var(--c-y);--drift-dur:19s;--morph-dur:15s;--delay:-2s;
                --r-a:58% 42% 47% 53% / 52% 46% 54% 48%;
                --r-b:47% 53% 61% 39% / 44% 58% 42% 56%;
                --r-c:62% 38% 44% 56% / 57% 43% 57% 43%;">
      <a class="bubble" href="#project-health">
        <span class="bubble-shape"></span>
      </a>
      <figure class="preview">
        <span class="preview-frame">
          <svg viewBox="0 0 120 90" role="img" aria-label="Health preview should be here">
            <rect width="120" height="90" fill="rgb(233,186,60)"/>
            <circle cx="42" cy="38" r="24" fill="rgba(255,255,255,.55)"/>
            <path d="M0 68 Q30 52 60 66 T120 58 V90 H0Z" fill="rgba(19,17,16,.18)"/>
          </svg>
        </span>
        <figcaption>health app</figcaption>
      </figure>
    </div>

    <div class="slot" data-side="left"
         style="--x:66%;--y:29%;--size:min(40vw,330px);--tint:var(--c-o);--drift-dur:23s;--morph-dur:18s;--delay:-7s;
                --r-a:52% 48% 39% 61% / 46% 55% 45% 54%;
                --r-b:63% 37% 52% 48% / 58% 41% 59% 42%;
                --r-c:44% 56% 58% 42% / 51% 47% 53% 49%;">
      <a class="bubble" href="#project-game">
        <span class="bubble-shape"></span>
      </a>
      <figure class="preview">
        <span class="preview-frame">
          <svg viewBox="0 0 120 90" role="img" aria-label="Game preview should be here">
            <rect width="120" height="90" fill="rgb(232,121,74)"/>
            <rect x="18" y="24" width="84" height="42" rx="18" fill="rgba(255,255,255,.5)"/>
            <circle cx="44" cy="45" r="7" fill="rgba(19,17,16,.35)"/>
            <circle cx="78" cy="45" r="7" fill="rgba(19,17,16,.35)"/>
          </svg>
        </span>
        <figcaption>Game</figcaption>
      </figure>
    </div>

    <div class="slot" data-side="right"
         style="--x:36%;--y:66%;--size:min(38vw,330px);--tint:var(--c-r);--drift-dur:21s;--morph-dur:16s;--delay:-11s;
                --r-a:49% 51% 56% 44% / 57% 43% 57% 43%;
                --r-b:60% 40% 43% 57% / 44% 59% 41% 56%;
                --r-c:53% 47% 62% 38% / 50% 52% 48% 50%;">
      <a class="bubble" href="#project-research">
        <span class="bubble-shape"></span>
      </a>
      <figure class="preview">
        <span class="preview-frame">
          <svg viewBox="0 0 120 90" role="img" aria-label="Research preview should be here">
            <rect width="120" height="90" fill="rgb(201,74,74)"/>
            <rect x="20" y="20" width="50" height="6" rx="3" fill="rgba(255,255,255,.7)"/>
            <rect x="20" y="36" width="74" height="6" rx="3" fill="rgba(255,255,255,.5)"/>
            <rect x="20" y="52" width="38" height="6" rx="3" fill="rgba(255,255,255,.5)"/>
            <circle cx="88" cy="64" r="14" fill="rgba(19,17,16,.22)"/>
          </svg>
        </span>
        <figcaption>WCAG</figcaption>
      </figure>
    </div>

    <div class="slot" data-side="left"
         style="--x:69%;--y:64%;--size:min(42vw,360px);--tint:var(--c-b);--drift-dur:25s;--morph-dur:20s;--delay:-16s;
                --r-a:46% 54% 51% 49% / 55% 45% 55% 45%;
                --r-b:57% 43% 60% 40% / 42% 57% 43% 58%;
                --r-c:50% 50% 42% 58% / 59% 40% 60% 41%;">
      <a class="bubble" href="#project-food">
        <span class="bubble-shape"></span>
      </a>
      <figure class="preview">
        <span class="preview-frame">
          <svg viewBox="0 0 120 90" role="img" aria-label="Food preview should be here">
            <rect width="120" height="90" fill="rgb(111,197,220)"/>
            <circle cx="60" cy="45" r="26" fill="rgba(255,255,255,.55)"/>
            <circle cx="60" cy="45" r="13" fill="rgba(19,17,16,.25)"/>
          </svg>
        </span>
        <figcaption>website</figcaption>
      </figure>
    </div>
  </div>

  <!-- top bubbles（JS） -->
  <div class="layer layer-top" id="layerTop" aria-hidden="true"></div>

  <!-- Cursor（JS） -->
  <div class="layer layer-cursor" id="layerCursor" aria-hidden="true"></div>
</main>

<!-- ===== Contents palce ===== -->
<section class="site-contents" id="contents">
</section>

<script src="lang.js"> </script>
<script src="bubble.js"></script>
</body>
</html>
