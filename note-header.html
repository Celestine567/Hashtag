<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziyi Liu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFA;
  --ink:#000;
  --accent:#E8596A;      /* 语言开关的红色圆块 */
  --font-display:"Roboto","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-display);}

/* ===== Header：三栏网格，中间永远居中 ===== */
.site-header{
  position:relative;
  z-index:60;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:1.5rem;
  padding:1.25rem clamp(1.25rem,4vw,3.5rem);
}

/* 左：logo + 名字（整块是一个链接） */
.brand{
  justify-self:start;
  display:inline-flex;
  align-items:center;
  gap:1.1rem;
  color:inherit;
  text-decoration:none;
}
.brand-logo{
  width:56px;height:56px;display:block;
  transition:transform .35s cubic-bezier(.3,1.4,.5,1);
}
.brand:hover .brand-logo,
.brand:focus-visible .brand-logo{transform:rotate(-12deg) scale(1.08);}
.brand:active .brand-logo{transform:scale(.94);}
.brand:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:999px;}
.wordmark{font-weight:700;font-size:1rem;line-height:1.2;margin:0;letter-spacing:0;}
.role{font-weight:500;font-size:.75rem;line-height:1.3;margin:0;}

/* 中：语言开关 */
.lang-switch{
  position:relative;
  display:grid;
  grid-template-columns:1fr 1fr;
  width:112px;height:46px;
  padding:5px;
  background:#000;
  border-radius:999px;
  box-shadow:0 4px 12px rgba(0,0,0,.28);
}
.lang-thumb{
  position:absolute;top:5px;left:5px;
  width:calc(50% - 5px);height:calc(100% - 10px);
  background:var(--accent);
  border-radius:999px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.lang-switch[data-lang="zh"] .lang-thumb{transform:translateX(100%);}
.lang-btn{
  position:relative;
  border:0;background:none;cursor:pointer;
  color:#fff;
  font:700 .95rem var(--font-display);
  border-radius:999px;
}
.lang-btn:focus-visible{outline:2px solid #fff;outline-offset:-3px;}

/* 右：导航 */
.site-nav{justify-self:end;display:flex;gap:3rem;}
.site-nav a{
  color:var(--ink);
  text-decoration:none;
  font-weight:700;
  font-size:1rem;
  padding:.25rem 0;
  border-bottom:2px solid transparent;
  transition:border-color .2s;
}
.site-nav a:hover,
.site-nav a:focus-visible,
.site-nav a[aria-current="page"]{border-bottom-color:var(--ink);}

/* 手机：logo 在左，导航在右，语言开关换到第二行居中 */
@media (max-width:720px){
  .site-header{grid-template-columns:1fr auto;}
  .lang-switch{grid-row:2;grid-column:1 / -1;justify-self:center;}
  .site-nav{gap:1.5rem;}
}
@media (prefers-reduced-motion:reduce){
  .brand-logo,.lang-thumb,.site-nav a{transition:none;}
}
</style>
</head>
<body>

<!-- ===== Heading ===== -->
<header class="site-header">

  <!-- left：点击回首页 -->
  <a class="brand" href="index.html" aria-label="Home">
    <img class="brand-logo" src="logo.svg" alt="">
    <div>
      <p class="wordmark">Ziyi Liu</p>
      <p class="role" data-i18n="role">UI/UX Designer</p>
    </div>
  </a>

  <!-- middle：语言切换 -->
  <div class="lang-switch" id="langSwitch" role="group" aria-label="Language" data-lang="en">
    <span class="lang-thumb" aria-hidden="true"></span>
    <button class="lang-btn" type="button" data-set-lang="en" aria-pressed="true">EN</button>
    <button class="lang-btn" type="button" data-set-lang="zh" aria-pressed="false">CN</button>
  </div>

  <!-- right：跳转到其他页面 -->
  <nav class="site-nav" aria-label="Main">
    <a href="projects.html" data-i18n="nav.projects">All Projects</a>
    <a href="about.html" data-i18n="nav.about">About</a>
  </nav>
</header>

<script>
/* ===== 多语言 ===== */
const I18N = {
  en: { "role":"UI/UX Designer", "nav.projects":"All Projects", "nav.about":"About" },
  zh: { "role":"UI/UX 设计师",   "nav.projects":"项目",     "nav.about":"关于我" }
};
const STORAGE_KEY = "site-lang";

function setLang(lang){
  if(!I18N[lang]) lang = "en";
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const text = I18N[lang][el.dataset.i18n];
    if(text) el.textContent = text;
  });
  const sw = document.getElementById("langSwitch");
  sw.dataset.lang = lang;
  sw.querySelectorAll("[data-set-lang]").forEach(b=>{
    b.setAttribute("aria-pressed", b.dataset.setLang === lang);
  });
  try{ localStorage.setItem(STORAGE_KEY, lang); }catch(e){}
}

document.querySelectorAll("[data-set-lang]").forEach(b=>{
  b.addEventListener("click", ()=> setLang(b.dataset.setLang));
});

/* 初始语言：上次选择 > 浏览器语言 > 英文 */
let saved = null;
try{ saved = localStorage.getItem(STORAGE_KEY); }catch(e){}
setLang(saved || (navigator.language.startsWith("zh") ? "zh" : "en"));
</script>
</body>
</html>
